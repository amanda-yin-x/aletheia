[project]
name = "aletheia"
version = "0.1.0"
description = "Policy CI for AI agents"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.0",
  "pypdf>=5.8.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.41",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
live = [
  "instructor>=1.10.0",
  "openai>=2.0.0"
]

[project.scripts]
aletheia = "app.cli:cli"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "types-PyYAML>=6.0.12"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
