services:
  - type: web
    name: aletheia-api
    runtime: docker
    plan: free
    region: virginia
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: API_ORIGIN_TOKEN
        sync: false
      - key: WEB_ORIGIN
        value: https://aletheia.aletheia-web.workers.dev
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_INLINE_JOBS
        value: "true"
      - key: GUEST_MAX_OPERATIONS
        value: "6"
      - key: GUEST_MAX_MUTATIONS
        value: "30"
      - key: GUEST_SESSION_TTL_HOURS
        value: "168"
      - key: GUEST_RETENTION_DAYS
        value: "30"
      - key: GUEST_CLEANUP_INTERVAL_HOURS
        value: "24"
      - key: API_MAX_BODY_BYTES
        value: "65536"
      - key: LOG_LEVEL
        value: INFO
