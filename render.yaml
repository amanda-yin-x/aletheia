services:
  - type: web
    name: aletheia-api
    runtime: docker
    plan: free
    region: virginia
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_AUDIENCE
        value: authenticated
      - key: API_ORIGIN_TOKEN
        sync: false
      - key: WEB_ORIGIN
        value: https://aletheia.aletheia-web.workers.dev
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_INLINE_JOBS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
